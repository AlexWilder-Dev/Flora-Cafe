name: Fetch Flora images

on:
  push:
    branches: [claude/flora-cafe-demo-7dri2b]
    paths: [.github/workflows/fetch-assets.yml, scripts/fetch-assets.sh]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-assets
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Probe one image request
        run: |
          curl -sS -D - -o /tmp/probe.bin -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -H 'Accept: image/avif,image/webp,image/apng,image/*,*/*;q=0.8' -H 'Referer: https://florasw17.com/' \
            -H 'Sec-Fetch-Dest: image' -H 'Sec-Fetch-Mode: no-cors' -H 'Sec-Fetch-Site: same-origin' \
            https://florasw17.com/wp-content/uploads/2026/07/booktable-02.webp || true
          head -c 600 /tmp/probe.bin | strings | head -20 || true
      - name: Download images
        timeout-minutes: 40
        env:
          DELAY: '12'
        run: bash scripts/fetch-assets.sh || true
      - name: Commit images
        if: always()
        run: |
          ls -la public/images
          git config user.name "AlexWilder-Dev"
          git config user.email "a.wilder196@gmail.com"
          git add public/images
          if git diff --cached --quiet; then echo "no new images"; else git commit -m "Add remaining Flora photos from florasw17.com" && git pull --rebase && git push; fi
