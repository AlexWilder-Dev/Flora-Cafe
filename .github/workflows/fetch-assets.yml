name: Fetch Flora images

on:
  push:
    branches: [claude/flora-cafe-demo-7dri2b]
    paths: [.github/workflows/fetch-assets.yml, scripts/fetch-assets.sh]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-assets
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Download images (paced to respect the host's rate limit)
        timeout-minutes: 45
        env:
          DELAY: '20'
        run: bash scripts/fetch-assets.sh || true
      - name: Commit images
        run: |
          ls -la public/images
          git config user.name "AlexWilder-Dev"
          git config user.email "a.wilder196@gmail.com"
          git add public/images
          if git diff --cached --quiet; then echo "no new images"; else git commit -m "Add remaining Flora photos from florasw17.com" && git pull --rebase && git push; fi
